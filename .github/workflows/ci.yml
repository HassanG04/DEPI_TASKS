name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Reproduce the supermarket pipeline
        run: supermarket-etl --output-dir /tmp/supermarket-output
      - name: Validate website JavaScript
        run: node --check assets/js/app.js
